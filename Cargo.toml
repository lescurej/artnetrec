[package]
name = "ncod-artnet"
version = "0.1.0"
edition = "2021"
description = "Edit, play, and record shows for standalone DMX players"
default-run = "ncod-artnet"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ncod-artnet"
path = "src/main.rs"

[[bin]]
name = "tr512-gui"
path = "src/bin/tr512_gui.rs"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
egui_plot = "0.29"
rfd = "0.15"
serde_json = "1"
notify = "7"
base64 = "0.22"
rmcp = { version = "3.12.0", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tokio-util = "0.7"
crossbeam-channel = "0.5"
