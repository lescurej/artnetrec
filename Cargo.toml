[package]
name = "ncod-artnet"
version = "0.1.0"
edition = "2021"
description = "Edit, play, and record shows for standalone DMX players"
default-run = "ncod-artnet"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ncod-artnet"
path = "src/main.rs"

[[bin]]
name = "tr512-gui"
path = "src/bin/tr512_gui.rs"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_plot = "0.29"
rfd = "0.15"
serde_json = "1"